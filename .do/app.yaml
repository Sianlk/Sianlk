# Sianlk Unified SaaS — DigitalOcean App Platform
# $5/month: apps-s-1vcpu-0.5gb (512 MB, 1 vCPU)
# SQLite = no managed-DB cost — all 11 apps share one container
# Import at: https://cloud.digitalocean.com/apps/new?repo=Sianlk/Sianlk

name: sianlk-unified
region: nyc

services:
  - name: api
    github:
      repo: Sianlk/Sianlk
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: sqlite+aiosqlite:///./sianlk.db
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: >-
          https://sianlk.com,https://app.sianlk.com,
          https://aiblty.sianlk.com,https://buildquote.sianlk.com,
          https://comppropdata.sianlk.com,https://geniqx.sianlk.com,
          https://gitgit.sianlk.com,https://terminalai.sianlk.com,
          https://aiaesthetics.sianlk.com,https://aib.sianlk.com,
          https://geniai.sianlk.com

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: CPU_UTILIZATION
    value: 85
    operator: GREATER_THAN
    window: FIVE_MINUTES
    disabled: false
