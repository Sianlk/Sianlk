name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sianlk
          POSTGRES_PASSWORD: sianlk
          POSTGRES_DB: sianlk_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx aiosqlite
      - run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-64-chars-ci-pipeline-minimum-length
          ENVIRONMENT: test

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sianlk.com
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to App Platform
        run: |
          APP_ID=$(doctl apps list --no-header --format ID,Name 2>/dev/null | grep "sianlk-unified" | awk '{print $1}' || true)
          if [ -z "$APP_ID" ]; then
            echo "Creating app..."
            doctl apps create --spec .do/app.yaml --wait
          else
            echo "Updating app $APP_ID..."
            doctl apps update "$APP_ID" --spec .do/app.yaml --wait
            doctl apps create-deployment "$APP_ID" --wait --no-reuselatestdeployment
          fi

      - name: Health check
        run: |
          sleep 20
          curl -sf https://sianlk.com/health || echo "Health check pending"
