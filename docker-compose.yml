version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sianlk:sianlk@db:5432/sianlk
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8081,exp://localhost:8081"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sianlk
      POSTGRES_PASSWORD: sianlk
      POSTGRES_DB: sianlk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sianlk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
